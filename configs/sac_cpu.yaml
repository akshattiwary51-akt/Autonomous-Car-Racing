# CPU-friendly SAC profile for small machines (e.g. 2 cores, ~7 GB RAM): fewer gradient updates per
# environment step (update-to-data ratio 0.25 instead of 1) and a smaller replay buffer.
# Measured here: ~19 steps/s vs ~6 steps/s for configs/sac.yaml (see README "Performance").
# The trade-off is lower sample efficiency; use configs/sac.yaml on a GPU machine.
experiment:
  name: sac_cpu
  seed: 0
  device: cpu
  track_memory_limit_fraction: 0.6

env:
  id: CarRacing-v3
  continuous: true
  lap_complete_percent: 0.95
  domain_randomize: false
  grayscale: true
  resize: 64
  frame_stack: 4
  action_repeat: 2
  n_envs: 1
  vec_type: dummy
  reward_shaping:
    enabled: false

algo:
  name: sac
  hyperparams:
    learning_rate: 0.0003
    buffer_size: 20000            # ~0.65 GiB
    learning_starts: 2000
    batch_size: 128
    tau: 0.005
    gamma: 0.99
    train_freq: 4
    gradient_steps: 1
    ent_coef: auto
  policy:
    features_dim: 256
    cnn_channels: [32, 64, 64]
    cnn_kernels: [8, 4, 3]
    cnn_strides: [4, 2, 1]
    net_arch: [256, 256]
    share_features_extractor: false

training:
  total_timesteps: 20000
  checkpoint_freq: 5000
  save_replay_buffer: false
  log_interval: 4

evaluation:
  eval_freq: 5000
  n_eval_episodes: 3
  deterministic: true
  final_n_episodes: 10
