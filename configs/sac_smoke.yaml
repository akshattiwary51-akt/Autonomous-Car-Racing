# Tiny configuration used by tests and the "definition of done" smoke run (not for real training).
experiment:
  name: sac_smoke
  seed: 0
  device: cpu
env:
  grayscale: true
  resize: 48
  frame_stack: 2
  action_repeat: 2
algo:
  name: sac
  hyperparams:
    buffer_size: 600
    learning_starts: 100
    batch_size: 32
    train_freq: 1
    gradient_steps: 1
  policy:
    features_dim: 64
    cnn_channels: [16, 32]
    cnn_kernels: [6, 4]
    cnn_strides: [3, 2]
    net_arch: [64, 64]
training:
  total_timesteps: 300
  checkpoint_freq: 150
  log_interval: 1
evaluation:
  eval_freq: 150
  n_eval_episodes: 1
  final_n_episodes: 1
